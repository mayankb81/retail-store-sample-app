# Harness-managed values file
# image is injected by Harness artifact expression at deploy time
image: <+artifacts.primary.image>

replicaCount: 1

namespace: default

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 512Mi

app:
  endpoints:
    catalog: http://catalog:80
    carts: http://carts:80
    orders: http://orders:80
    checkout: http://checkout:80

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
