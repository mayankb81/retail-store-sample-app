apiVersion: v1
kind: Service
metadata:
  name: retail-store-ui
  namespace: default
  labels:
    app: retail-store-ui
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: retail-store-ui
