apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-store-ui
  namespace: default
  labels:
    app: retail-store-ui
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: retail-store-ui
  template:
    metadata:
      labels:
        app: retail-store-ui
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: ui
          image: {{ .Values.image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-config
                  key: SPRING_PROFILES_ACTIVE
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-config
                  key: JAVA_OPTS
            - name: RETAIL_UI_ENDPOINTS_CATALOG
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-config
                  key: RETAIL_UI_ENDPOINTS_CATALOG
            - name: RETAIL_UI_ENDPOINTS_CARTS
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-config
                  key: RETAIL_UI_ENDPOINTS_CARTS
            - name: RETAIL_UI_ENDPOINTS_ORDERS
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-config
                  key: RETAIL_UI_ENDPOINTS_ORDERS
            - name: RETAIL_UI_ENDPOINTS_CHECKOUT
              valueFrom:
                configMapKeyRef:
                  name: retail-store-ui-config
                  key: RETAIL_UI_ENDPOINTS_CHECKOUT
            - name: METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: METADATA_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            limits:
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
